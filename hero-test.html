<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Hero-Test NeuralNautic</title>
    <link rel="icon" href="/brand/nn-stern-kompass-favicon.ico">
    <link rel="stylesheet" href="/src/hero-test/test.css">
  </head>
  <body>
    <header class="kopf">
      <img class="kopf__logo" src="/brand/nn-stern-kompass-128.png" width="40" height="40" alt="NeuralNautic">
    </header>
    <section class="hero" data-hero style="--hero-grund:#061419">
      <div class="hero__pin">
        <div class="hero__buehne">
      <!-- HERO-BILDER:START -->
      <picture class="hero__bild" data-figur="frank" style="--asp:1.7768;--ax:0.2491;--ay:0.3567;--ab:0.4698;--xd:0.5;--yd:0.48;--kd:0.42;--xm:0.5;--ym:0.5;--km:0.44;--hof:url('/bilder/frank-auswahl-frontal-1-hof.webp')">
        <img src="/bilder/frank-auswahl-frontal-1-1600.webp" srcset="/bilder/frank-auswahl-frontal-1-640.webp 640w, /bilder/frank-auswahl-frontal-1-1000.webp 1000w, /bilder/frank-auswahl-frontal-1-1600.webp 1600w" sizes="(max-width: 991px) 333vw, 99vw"
             width="1672" height="941" alt="" decoding="async" fetchpriority="high">
      </picture>
      <!-- HERO-BILDER:ENDE -->
        </div>
        <p class="hero__ki">KI-generiert</p>
      </div>
    </section>
    <!-- Ganzkoerper-Szene (zweites Kern-Modul), Scroll-Punkte aus figuren.json -->
    <section class="szene" data-szene="frank"></section>
    <!-- Ganzkoerper-Szene mit Positionswechsel (ablauf.bahn, blick: bewegung) -->
    <section class="szene" data-szene="frank" data-bahn="1"></section>
    <!-- Platzhalter: nur Hoehe zum Scrollen, kein Inhalt -->
    <div class="platzhalter" aria-hidden="true"></div>
    <script type="module" src="/src/hero-test/main.js"></script>
  </body>
</html>
